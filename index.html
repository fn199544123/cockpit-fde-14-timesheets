</style></head><body><header><div class="logo"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10h4v10M10 20V4h4v16M16 20v-7h4v7M2 20h20"/></svg></span>某企业 <span class="muted">/ 工时台账</span></div><span class="muted">演示身份 · douyin</span></header><div id="storageError" hidden></div><main><section class="hero"><div><small>项目投入 · 成本核算 · 预算预警</small><h1>让每一小时，都有据可查</h1><p>项目与人员投入一目了然，及时掌握预算使用情况。</p></div><button class="primary" id="newEntry">＋ 登记工时</button></section><section class="stats" id="stats"></section><nav class="nav" aria-label="功能导航"><button data-tab="projects" class="active">项目总览</button><button data-tab="entries">工时明细</button><button data-tab="people">人员汇总</button></nav><section class="card"><div class="sectionhead"><div><h2 id="sectionTitle"></h2><small id="sectionSub"></small></div><div><button id="export">导出 CSV</button> <button id="add" class="primary"></button></div></div><div class="filters"><label>开始日期<input id="from" type="date"></label><label>结束日期<input id="to" type="date"></label><label>项目<select id="projectFilter"></select></label><label>人员<select id="personFilter"></select></label><button id="clearFilter">清除筛选</button></div><div id="filterError" class="error" hidden></div><div class="note">统计卡片与投入汇总跟随筛选；预算使用和超预算预警按项目全部历史成本计算。成本 = 工时 × 登记时保存的时薪。</div><div class="scroll" id="table"></div></section><footer><span>演示数据·服务端数据库保存 · 编号虚构，人员均为化名</span><button id="reset">重置演示数据</button></footer></main><dialog id="editor"><form id="form" novalidate><h2 id="dialogTitle"></h2><div id="fields" class="fields"></div><div id="formError" class="error" role="alert"></div><div class="actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存</button></div></form></dialog><div id="toast" role="status" hidden></div><script>// Embedded in each application. No localStorage business persistence or fallback.
const backend = (() => {
  let revision = null, initial = true, reset = false, busy = false, failed = false;
  let seedData;
  const endpoint = new URL('api/state', location.href.replace(/index\.html(?:\?.*)?$/, ''));
  function failure(message) {
    failed = true;
    document.body.inert = true;
    let box = document.getElementById('backend-failure');
    if (!box) {
      box = document.createElement('dialog'); box.id = 'backend-failure';
      document.documentElement.append(box);
    }
    box.replaceChildren();
    const title = document.createElement('h2'); title.textContent = '数据未保存';
    const detail = document.createElement('p'); detail.textContent = message;
    const button = document.createElement('button'); button.textContent = '刷新并读取服务器数据';
    button.onclick = () => location.reload();
    box.append(title, detail, button); if (!box.open) box.showModal();
  }
  async function request(options) {
    try {
      const response = await fetch(endpoint, {credentials: 'same-origin', cache: 'no-store', ...options});
      if (!response.ok) {
        let message = '服务器不可用或当前账号没有操作权限。';
        try { message = (await response.json()).error || message; } catch (_) {}
        throw Error(message);
      }
      return await response.json();
    } catch (error) {
      failure(error.message || '请求失败，请刷新核对服务器数据。');
      throw error;
    }
  }
  return {
    async load() {
      const result = await request(); revision = result.revision; seedData = result.seed;
      return JSON.stringify(result.data);
    },
    seed() {
      if (!initial) reset = true;
      return structuredClone(seedData);
    },
    ready() { initial = false; window.backendReady = true; document.documentElement.dataset.backendReady = 'true'; },
    async save(data) {
      if (failed || busy || revision === null) throw Error('请等待保存完成或刷新后重试');
      busy = true; document.body.inert = true;
      try {
        const csrf = document.cookie.split('; ').find(x => x.startsWith('csrftoken='))?.slice(10) || '';
        const result = await request({method: 'POST', headers: {
          'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': csrf
        }, body: JSON.stringify({revision, action: reset ? 'reset' : 'save', data,
          context: {product: document.getElementById('shipProduct')?.value, room: document.getElementById('shipRoom')?.value}})});
        revision = result.revision; reset = false;
      } finally {
        busy = false;
        if (!failed) document.body.inert = false;
      }
    },
    failure
  };
})();
window.addEventListener('unhandledrejection', event => { backend.failure(event.reason?.message || '操作失败，请刷新核对'); event.preventDefault(); });

(async () => {
const backendInitial = await backend.load();

'use strict';
const KEY='development-14-state-v1';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const money=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const round=n=>Math.round((n+Number.EPSILON)*100)/100;const cost=e=>round(e.hours*e.rate);const sum=(a,fn)=>round(a.reduce((s,x)=>s+fn(x),0));
function seed(){return {projects:[{id:'P-001',name:'某企业 · P-001',budget:10000},{id:'P-002',name:'某企业 · P-002',budget:3000},{id:'P-003',name:'某企业 · P-003',budget:8000}],people:[{id:'R-001',name:'化名甲',rate:200},{id:'R-002',name:'化名乙',rate:150},{id:'R-003',name:'化名丙',rate:180}],entries:[{id:'E-001',date:today(),project:'P-001',person:'R-001',hours:6,rate:200},{id:'E-002',date:today(),project:'P-002',person:'R-002',hours:8,rate:150},{id:'E-003',date:today(),project:'P-002',person:'R-003',hours:8,rate:180},{id:'E-004',date:today(),project:'P-003',person:'R-001',hours:4,rate:200}]}}
let state=backend.seed(),tab='projects',editing=null,kind='';try{const raw=backendInitial;if(raw){const v=JSON.parse(raw);if(!v||!Array.isArray(v.projects)||!Array.isArray(v.people)||!Array.isArray(v.entries)||!v.projects.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Number.isFinite(x.budget)&&x.budget>=0)||!v.people.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Number.isFinite(x.rate)&&x.rate>=0)||!v.entries.every(x=>typeof x.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&Number.isFinite(x.hours)&&x.hours>0&&x.hours<=24&&Number.isFinite(x.rate)&&x.rate>=0&&v.projects.some(p=>p.id===x.project)&&v.people.some(p=>p.id===x.person)))throw Error('数据格式异常');state=v}}catch(e){$('storageError').hidden=false;$('storageError').textContent='浏览器存储不可用或数据格式异常。当前显示默认演示数据；保存失败会明确提示，可用重置恢复。'}

function options(a,value,all){return (all?'<option value="">全部</option>':'')+a.map(x=>`<option value="${esc(x.id)}" ${value===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}

function filtered(){const f=$('from').value,t=$('to').value,p=$('projectFilter').value,r=$('personFilter').value;const invalid=f&&t&&f>t;$('filterError').hidden=!invalid;$('filterError').textContent=invalid?'开始日期不能晚于结束日期':'';return invalid?[]:state.entries.filter(e=>(!f||e.date>=f)&&(!t||e.date<=t)&&(!p||e.project===p)&&(!r||e.person===r))}

function rowsData(){const a=filtered();if(tab==='entries')return {heads:['日期','项目 / 虚构编号','人员化名','工时 (h)','登记时薪 (元/h)','成本 (元)'],rows:[...a].sort((x,y)=>y.date.localeCompare(x.date)).map(e=>({id:e.id,values:[e.date,projectName(e.project),personName(e.person),e.hours,e.rate,cost(e)]}))};if(tab==='people')return {heads:['人员化名','虚构编号','当前时薪 (元/h)','涉及项目','筛选工时 (h)','筛选成本 (元)'],rows:state.people.filter(p=>!$('personFilter').value||p.id===$('personFilter').value).map(p=>{const list=a.filter(e=>e.person===p.id);return {id:p.id,values:[p.name,p.id,p.rate,new Set(list.map(e=>e.project)).size,sum(list,e=>e.hours),sum(list,cost)]}})};return {heads:['项目 / 虚构编号','预算 (元)','筛选工时 (h)','筛选成本 (元)','累计成本 (元)','预算状态'],rows:state.projects.filter(p=>!$('projectFilter').value||p.id===$('projectFilter').value).map(p=>{const list=a.filter(e=>e.project===p.id),total=sum(state.entries.filter(e=>e.project===p.id),cost);return {id:p.id,total,budget:p.budget,values:[p.name,p.budget,sum(list,e=>e.hours),sum(list,cost),total,total>p.budget?'超预算 '+money(total-p.budget):'预算内']}})}}
function render(){const a=filtered(),over=state.projects.filter(p=>sum(state.entries.filter(e=>e.project===p.id),cost)>p.budget).length;$('stats').innerHTML=[['投入工时',sum(a,e=>e.hours)+' h','当前筛选范围'],['人力成本',money(sum(a,cost)),'按登记时薪计算'],['参与人员',new Set(a.map(e=>e.person)).size+' 人','当前筛选范围'],['超预算项目',over+' 个','全部项目 · 历史累计']].map((s,i)=>`<div class="card stat"><span>${s[0]}</span><strong class="${i===3&&over?'danger':''}" id="metric${i}">${s[1]}</strong><small>${s[2]}</small></div>`).join('');$('sectionTitle').textContent={projects:'项目预算与投入',entries:'工时登记明细',people:'人员投入汇总'}[tab];$('sectionSub').textContent={projects:'追踪投入，掌握每个项目的预算余量',entries:'按日期、项目和人员记录每一笔投入',people:'人员使用化名，历史成本保留登记时薪'}[tab];$('add').textContent={projects:'＋ 新增项目',entries:'＋ 登记工时',people:'＋ 新增人员'}[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const data=rowsData();$('table').innerHTML=`<table><thead><tr>${data.heads.map(h=>`<th>${h}</th>`).join('')}<th>操作</th></tr></thead><tbody>${data.rows.map(r=>`<tr>${r.values.map((v,i)=>`<td>${tab==='projects'&&i===5?`<span class="tag ${r.total>r.budget?'red':''}">${esc(v)}</span><div class="bar"><i class="${r.total>r.budget?'red':''}" style="width:${r.budget?Math.min(100,r.total/r.budget*100):r.total?100:0}%"></i></div>`:esc(v)}</td>`).join('')}<td><button data-edit="${esc(r.id)}">修改</button>${tab==='entries'?` <button data-delete="${esc(r.id)}">删除</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">暂无符合条件的数据，请调整筛选或新增记录。</td></tr>'}</tbody></table>`}
